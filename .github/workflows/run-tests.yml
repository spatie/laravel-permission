name: Run Tests - Current

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']
        laravel: ["^13", "^12"]
        dependency-version: [highest, lowest]
        include:
          - php: '8.5'
            pest: '^5.0'
          - php: '8.4'
            pest: '^5.0'
          - php: '8.3'
            pest: '^4.4.1'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependency-version }}
          composer-options: --with "laravel/framework:${{ matrix.laravel }}" --with "pestphp/pest:${{ matrix.pest }}"

      - name: Execute tests
        run: vendor/bin/pest
