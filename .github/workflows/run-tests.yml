name: Run Tests - Current

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']
        laravel: ["^13", "^12"]
        dependency-version: [highest, lowest]
        include:
          - laravel: "^13"
            pest: '^5.0'
          # Testbench 10 requires Symfony Process 7; Pest 5 requires Symfony Process 8.
          - laravel: "^12"
            pest: '^4.4.1'
          - php: '8.3'
            pest: '^4.4.1'
          # Older Laravel releases do not support PHP 8.6's session interfaces.
          - php: '8.6'
            laravel: "^13"
            pest: '^5.0'
            dependency-version: highest
            composer-options: --ignore-platform-req=php+

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependency-version }}
          composer-options: --with "laravel/framework:${{ matrix.laravel }}" --with "pestphp/pest:${{ matrix.pest }}" ${{ matrix.composer-options }}

      - name: Execute tests
        run: vendor/bin/pest
